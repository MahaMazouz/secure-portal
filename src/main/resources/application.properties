spring.application.name=secure-portal
server.port=8080

# Mots de passe injectes par variables d'environnement (jamais dans le code ni dans l'image)
app.user.password=${APP_USER_PASSWORD}
app.admin.password=${APP_ADMIN_PASSWORD}

# Le TP4 utilisait include=* : cela expose /env et /heapdump (fuite de secrets).
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}

# Ne jamais renvoyer de trace d'erreur au client ; cookies de session proteges
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
